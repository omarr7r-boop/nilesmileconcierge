<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>QA viewports</title>
<style>
  html,body{margin:0;padding:0;background:#050D1A;overflow-x:hidden}
  #wrap{position:relative;overflow:hidden}
  iframe{border:0;display:block;background:#050D1A;transform-origin:top left}
</style>
</head>
<body>
<div id="wrap"><iframe id="frame" src="index.html"></iframe></div>
<script>
  const q = new URLSearchParams(location.search);
  const w = Number(q.get('w') || 375);
  const h = Number(q.get('h') || 1000);
  const p = q.get('p') || 'index.html';
  const avail = Math.min(window.innerWidth, 1600);
  const scale = Math.min(1, avail / w);
  const f = document.getElementById('frame');
  const wrap = document.getElementById('wrap');
  f.style.width = w + 'px';
  f.style.height = h + 'px';
  f.style.transform = 'scale(' + scale + ')';
  wrap.style.width = Math.round(w * scale) + 'px';
  wrap.style.height = Math.round(h * scale) + 'px';
  f.src = p;
</script>
</body>
</html>
